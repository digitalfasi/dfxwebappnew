<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JROS Product Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
  :root{
    --ink:#1C1428;
    --ink-2:#2A1E3B;
    --ink-soft:#4A3D5C;
    --gold:#C79A2B;
    --gold-light:#E8C766;
    --gold-dim:#C79A2B33;
    --cream:#FAF7F0;
    --paper:#FFFFFF;
    --slate:#2B2733;
    --muted:#7A7288;
    --line:#EAE3D3;
    --success:#2F9E5B;
    --danger:#C24545;
    --radius:10px;
    --font-display:'Poppins',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--cream);
    color:var(--slate);
    display:flex;
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:290px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
    color:#EDE7F5;
    height:100vh;
    position:sticky;
    top:0;
    overflow-y:auto;
    padding:0 0 32px;
    z-index:20;
  }
  #sidebar::-webkit-scrollbar{width:6px;}
  #sidebar::-webkit-scrollbar-thumb{background:var(--ink-soft);border-radius:4px;}
  .brand{
    padding:28px 24px 20px;
    border-bottom:1px solid #3A2E4D;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:var(--gold-light);
    font-size:15px;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #3A2A55, #1C1428);
  }
  .brand-text .name{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;letter-spacing:.3px;}
  .brand-text .sub{font-size:11px;color:var(--gold-light);letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
  .group-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#8B7FA3;
    padding:20px 24px 8px;font-weight:600;
  }
  .chapter-link{
    display:flex;align-items:center;gap:10px;
    padding:9px 24px;
    font-size:13.5px;color:#C9C0DB;
    text-decoration:none;
    cursor:pointer;
    border-left:2.5px solid transparent;
    transition:background .15s, color .15s;
  }
  .chapter-link .num{
    font-family:var(--font-mono);font-size:11px;color:#7A6E93;width:18px;flex-shrink:0;
  }
  .chapter-link:hover{background:#2E2242;color:#fff;}
  .chapter-link.active{
    background:#2E2242;color:#fff;border-left-color:var(--gold);
  }
  .chapter-link.active .num{color:var(--gold-light);}
  .chapter-link.disabled{color:#5D5573;cursor:default;}
  .chapter-link.disabled:hover{background:transparent;color:#5D5573;}
  .chapter-link .soon{
    margin-left:auto;font-size:9px;font-family:var(--font-mono);
    color:#5D5573;letter-spacing:.5px;
  }

  /* ---------- MAIN ---------- */
  #main{
    flex:1;
    min-width:0;
    padding:48px 56px 120px;
    max-width:980px;
  }
  .crumb{
    font-family:var(--font-mono);font-size:11.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;
  }
  .chapter-header{
    display:flex;gap:20px;align-items:flex-start;
    margin-bottom:8px;
  }
  .seal{
    width:64px;height:64px;flex-shrink:0;
  }
  .chapter-title h1{
    font-family:var(--font-display);font-weight:700;font-size:32px;margin:0 0 6px;color:var(--ink);
    letter-spacing:-.2px;
  }
  .chapter-title .tagline{color:var(--muted);font-size:14.5px;max-width:640px;}
  .chapter-divider{
    height:1px;background:linear-gradient(90deg,var(--gold) 0%, var(--line) 40%);
    margin:28px 0 36px;
  }
  section.block{margin-bottom:38px;}
  .block h2{
    font-family:var(--font-display);font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);
    display:flex;align-items:center;gap:10px;margin:0 0 14px;
  }
  .block h2 .idx{
    font-family:var(--font-mono);font-size:11px;color:#fff;background:var(--ink);
    width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    letter-spacing:0;
  }
  .block p{line-height:1.65;font-size:14.5px;color:var(--slate);margin:0 0 10px;}
  .block ul, .block ol{line-height:1.7;font-size:14.5px;padding-left:20px;margin:0 0 10px;}
  .block li{margin-bottom:4px;}

  table{
    width:100%;border-collapse:collapse;font-size:13.5px;
    background:var(--paper);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 0 0 1px var(--line);
  }
  thead th{
    background:var(--ink);color:#fff;text-align:left;
    padding:10px 14px;font-family:var(--font-display);font-weight:600;font-size:12.5px;
  }
  tbody td{
    padding:9px 14px;border-top:1px solid var(--line);vertical-align:top;
  }
  tbody tr:nth-child(even){background:#FDFBF6;}
  td code, p code, li code{
    font-family:var(--font-mono);background:#F1EBDD;color:#8A5A00;
    padding:1px 6px;border-radius:4px;font-size:12.5px;
  }
  .id-tag{
    font-family:var(--font-mono);font-weight:600;color:var(--gold);white-space:nowrap;
  }
  table + table{margin-top:14px;}
  .table-wrap{margin-bottom:14px;overflow-x:auto;}

  .callout{
    border-left:3px solid var(--gold);
    background:#FBF6E9;
    padding:12px 16px;border-radius:6px;font-size:13.5px;line-height:1.6;
    margin-bottom:14px;
  }
  .not-applicable{
    color:var(--muted);font-style:italic;font-size:13.5px;
  }
  .mermaid{
    background:var(--paper);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);
    padding:20px;margin-bottom:14px;
  }
  .checklist{list-style:none;padding-left:0;}
  .checklist li{
    display:flex;gap:8px;font-size:14px;margin-bottom:7px;align-items:flex-start;
  }
  .checklist li::before{
    content:"";width:15px;height:15px;border-radius:4px;border:1.5px solid var(--gold);
    flex-shrink:0;margin-top:2px;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip{
    font-family:var(--font-mono);font-size:11.5px;background:var(--ink);color:var(--gold-light);
    padding:4px 10px;border-radius:20px;
  }
  .placeholder{
    text-align:center;padding:100px 20px;color:var(--muted);
  }
  .placeholder .big-num{
    font-family:var(--font-display);font-size:60px;font-weight:700;color:var(--gold-dim);
  }
  footer.page-footer{
    margin-top:60px;padding-top:20px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);display:flex;justify-content:space-between;
  }
  .screen-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:10px;
  }
  .screen-card{
    background:var(--paper);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);overflow:hidden;
    transition:box-shadow .15s;
  }
  .screen-card:hover{box-shadow:0 0 0 1px var(--gold), 0 6px 16px rgba(28,20,40,.08);}
  .screen-card img{width:100%;display:block;border-bottom:1px solid var(--line);background:#F1EBDD;}
  .screen-card .cap{padding:9px 11px;}
  .screen-card .cap .t{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink);}
  .screen-card .cap .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .screen-card .cap .id{font-family:var(--font-mono);font-size:10px;color:var(--gold);margin-bottom:3px;display:block;}
  .surface-heading{
    display:flex;align-items:center;gap:10px;margin:26px 0 14px;
  }
  .surface-heading .line{flex:1;height:1px;background:var(--line);}
  .surface-heading span.label{
    font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--gold-dim);padding:5px 12px;border-radius:20px;
  }
  .flow-strip{display:flex;gap:14px;overflow-x:auto;padding:6px 0 14px;}
  .flow-strip img{
    height:170px;border-radius:8px;box-shadow:0 0 0 1px var(--line);flex-shrink:0;
  }
  .flow-strip .arrow{align-self:center;color:var(--gold);font-size:22px;flex-shrink:0;}
  @media (max-width: 860px){
    #sidebar{position:fixed;left:-290px;transition:left .2s;}
    #sidebar.open{left:0;}
    #main{padding:24px;}
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="brand">
    <div class="brand-mark">JR</div>
    <div class="brand-text">
      <div class="name">JROS</div>
      <div class="sub">Product Bible</div>
    </div>
  </div>

  <div id="nav-list"></div>
</nav>

<main id="main"></main>

function renderSidebar(){
  const list = document.getElementById('nav-list');
  let html = '';
  let currentGroup = null;
  CHAPTERS.forEach(ch=>{
    if(ch.group !== currentGroup){
      html += `<div class="group-label">${ch.group}</div>`;
      currentGroup = ch.group;
    }
    html += `<a class="chapter-link ${ch.ready ? '' : 'disabled'}" data-n="${ch.n}" onclick="${ch.ready ? `goTo(${ch.n})` : ''}">

function seal(n){
  return `<svg class="seal" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

}

function goTo(n){
  document.querySelectorAll('.chapter-link').forEach(el=>el.classList.remove('active'));
  const active = document.querySelector(`.chapter-link[data-n="${n}"]`);
  if(active) active.classList.add('active');
  const ch = CHAPTERS.find(c=>c.n===n);
  const main = document.getElementById('main');
  if(!ch.ready){
    main.innerHTML = `<div class="placeholder"><div class="big-num">${String(n).padStart(2,'0')}</div><p>${ch.title} — coming up in a later turn.</p></div>`;
    return;
  }
  const fn = window['render_ch' + n];
  if(fn){ main.innerHTML = fn(); mermaid.init(undefined, document.querySelectorAll('.mermaid')); }
  window.scrollTo(0,0);
  if(window.innerWidth <= 860) document.getElementById('sidebar').classList.remove('open');
}

    <section class="block">
      <h2><span class="idx">9</span>UI/UX Notes</h2>

    <section class="block">

    <section class="block">

    <section class="block">

    <section class="block">
      <h2><span class="idx">14</span>Error Handling</h2>

        <thead><tr><th>Code</th><th>HTTP status</th><th>Meaning / UI treatment</th></tr></thead>
        <tbody>
          <tr><td><code>VALIDATION_ERROR</code></td><td>400</td><td>Inline, field-specific message (Chapter 17)</td></tr>
          <tr><td><code>UNAUTHENTICATED</code></td><td>401</td><td>Redirect to login</td></tr>
          <tr><td><code>FORBIDDEN</code></td><td>403</td><td>"You don't have permission" state, no data leaked (Chapter 18)</td></tr>
          <tr><td><code>NOT_FOUND</code></td><td>404</td><td>Branded 404 state (Chapter 7)</td></tr>
          <tr><td><code>CONFLICT</code></td><td>409</td><td>e.g. duplicate enrollment attempt — explain the conflict</td></tr>
          <tr><td><code>PAYMENT_FAILED</code></td><td>402/400</td><td>Retry / change payment method state (Chapter 9 Flow A/B)</td></tr>
          <tr><td><code>PLAN_LIMIT_EXCEEDED</code></td><td>403</td><td>"Upgrade to unlock" state (Chapter 4)</td></tr>
          <tr><td><code>SERVER_ERROR</code></td><td>500</td><td>Generic "something went wrong, try again" — never expose internals</td></tr>
        </tbody>
      </table></div>
    </section>

    <section class="block">
      <h2><span class="idx">3</span>Business Goals</h2>
      <p>Clear, consistent error handling directly protects trust for Priya (a failed payment must never look like a lost payment) and reduces support ticket volume for jewellers.</p>
    </section>

    <section class="block">
      <h2><span class="idx">4</span>Features</h2>
      <p class="not-applicable">Error handling is cross-cutting, not a feature of its own.</p>
    </section>

    <section class="block">
      <h2><span class="idx">5</span>Functional Requirements</h2>
      <div class="table-wrap"><table>
        <thead><tr><th style="width:90px">ID</th><th>Requirement</th></tr></thead>
        <tbody>
          <tr><td class="id-tag">FR-021-01</td><td>Every API response error MUST use exactly one code from Section 2's catalogue — no ad-hoc new codes without updating this chapter.</td></tr>
          <tr><td class="id-tag">FR-021-02</td><td>Every screen in Chapter 8 with a mutating action MUST define an explicit error UI state, not rely on a generic toast.</td></tr>
          <tr><td class="id-tag">FR-021-03</td><td>Payment failure (Chapter 9 Flow A/B) MUST present a Retry / Change Payment Method choice, never a dead end.</td></tr>
        </tbody>
      </table></div>
    </section>

    <section class="block">
      <h2><span class="idx">6</span>Business Rules</h2>
      <div class="table-wrap"><table>
        <thead><tr><th style="width:90px">ID</th><th>Rule</th></tr></thead>
        <tbody>
          <tr><td class="id-tag">BR-021-01</td><td>A <code>SERVER_ERROR</code> response never includes stack traces, internal IDs, or database error text in production.</td></tr>
        </tbody>
      </table></div>
    </section>

    <section class="block">
      <h2><span class="idx">7</span>User Roles Involved</h2>
      <p>All roles experience error states; engineering owns implementation, support uses error codes to triage tickets.</p>
    </section>

    <section class="block">
      <h2><span class="idx">8</span>Developer Notes</h2>
      <p>Implement a single error-handling middleware at the API layer that maps internal exceptions to Section 2's catalogue, and a single error-boundary/handler on each client that maps codes to UI states — both driven by the same table.</p>
    </section>

    <section class="block">
      <h2><span class="idx">9</span>UI/UX Notes</h2>
      <p>Every empty, loading, and error state referenced across Chapters 10–12 resolves to a variant defined in this chapter — design them together, not screen-by-screen in isolation.</p>
    </section>

    <section class="block">
      <h2><span class="idx">10</span>Database Considerations</h2>
      <p>Database-level errors (constraint violations, Chapter 14 Section 14) are translated to <code>VALIDATION_ERROR</code> or <code>CONFLICT</code> before reaching the client — never surfaced raw.</p>
    </section>

    <section class="block">
      <h2><span class="idx">11</span>API Considerations</h2>
      <p class="not-applicable">This chapter <em>is</em> the API error-handling reference for Chapter 15.</p>
    </section>

    <section class="block">
      <h2><span class="idx">12</span>Validation Rules</h2>

      <p>15 screens across 3 surfaces were identified in the reference mockups. Screen IDs follow the pattern <code>SCR-[SURFACE]-[NN]</code>: <code>CUST</code> = Customer App, <code>ADM</code> = Jeweller Admin Dashboard, <code>SA</code> = Super Admin Panel.</p>

      <div class="surface-heading"><span class="line"></span><span class="label">Customer Mobile App — 8 screens</span><span class="line"></span></div>
      <div class="screen-grid">
        ${screenCard('SCR-CUST-01','customer_1_splash','Splash Screen','Brand intro with logo and tagline. Auto-navigates to Login after a short delay.')}
        ${screenCard('SCR-CUST-02','customer_2_login','Login / Signup','Mobile number entry, OTP, Google/Apple/biometric login, tenant-branded welcome copy.')}
        ${screenCard('SCR-CUST-03','customer_3_home_dashboard','Home Dashboard','Current gold savings summary, gold rate, next installment, offer banner, quick actions.')}
        ${screenCard('SCR-CUST-04','customer_4_scheme_details','Scheme Details','Progress ring of gold saved vs target, installment count, AutoPay & reminder toggles.')}
        ${screenCard('SCR-CUST-05','customer_5_payment_screen','Pay Installment','Payment summary (amount, gold rate, GST, total), payment method selector, Pay CTA.')}
        ${screenCard('SCR-CUST-06','customer_6_digital_passbook','Digital Passbook','Full payment ledger for a scheme — date, gold weight credited, status; download/share.')}
        ${screenCard('SCR-CUST-07','customer_7_product_catalogue','Product Catalogue','Search, category filters, featured collections, best-sellers grid with price & weight.')}
        ${screenCard('SCR-CUST-08','customer_8_branch_locator','Branch Locator','Map view, nearest branch card with distance, address, Call and Directions actions.')}
      </div>

      <div class="surface-heading"><span class="line"></span><span class="label">Jeweller Admin Dashboard — 3 screens</span><span class="line"></span></div>
      <div class="screen-grid">
        ${screenCard('SCR-ADM-01','admin_1_admin_dashboard','Admin Dashboard','KPI cards (customers, active schemes, collections, pending payments, revenue), trend charts.')}
        ${screenCard('SCR-ADM-02','admin_2_customer_management','Customer Management','Searchable customer table — scheme, status, outstanding amount, row-level actions.')}
        ${screenCard('SCR-ADM-03','admin_3_scheme_management','Scheme Management','Scheme template table — type, tenure, min amount, interest/bonus, status; Create Scheme.')}
      </div>

      <div class="surface-heading"><span class="line"></span><span class="label">Super Admin Panel — 4 screens</span><span class="line"></span></div>
      <div class="screen-grid">
        ${screenCard('SCR-SA-01','super_1_super_admin_dashboard','Super Admin Dashboard','Platform KPIs — total jewellers, active subscriptions, monthly revenue, tenant growth.')}
        ${screenCard('SCR-SA-02','super_2_tenant_management','Tenant Management','List of all tenants — plan, status, due date, actions; Add Tenant.')}
        ${screenCard('SCR-SA-03','super_3_branding_settings','Branding & White Label','Per-tenant colors, fonts, logo/splash upload, live mobile preview before publishing.')}
        ${screenCard('SCR-SA-04','super_4_design_system','Design System Overview','Reference panel: color tokens, Poppins type scale, buttons, component catalogue.')}
      </div>
    </section>

    <section class="block">
      <h2><span class="idx">3</span>Business Goals</h2>
      <p>A shared screen vocabulary prevents rework: designers, developers, and QA all point at "SCR-CUST-05" instead of describing it differently in three different documents.</p>
    </section>

    <section class="block">
      <h2><span class="idx">4</span>Features</h2>
      <p class="not-applicable">See feature-per-screen breakdown above; full feature list lives in Chapter 3 — Product Requirements.</p>
    </section>

    <section class="block">
      <h2><span class="idx">5</span>Functional Requirements</h2>
      <div class="table-wrap"><table>
        <thead><tr><th style="width:90px">ID</th><th>Requirement</th></tr></thead>
        <tbody>
          <tr><td class="id-tag">FR-008-01</td><td>Every screen ID in this chapter must map to exactly one route/page in the codebase (see Chapter 7 — Navigation Architecture for the route table).</td></tr>
          <tr><td class="id-tag">FR-008-02</td><td>Any new screen added after MVP must be registered here with a new Screen ID before implementation starts.</td></tr>
        </tbody>
      </table></div>
    </section>

    <section class="block">
      <h2><span class="idx">6</span>Business Rules</h2>
      <div class="table-wrap"><table>
        <thead><tr><th style="width:90px">ID</th><th>Rule</th></tr></thead>
        <tbody>
          <tr><td class="id-tag">BR-008-01</td><td>Screen IDs are permanent once assigned — never reused for a different screen, even if the original is deprecated.</td></tr>
          <tr><td class="id-tag">BR-008-02</td><td>All Customer App and Jeweller Admin screens must render using tenant branding tokens (Chapter 11), never hardcoded JROS colors — SCR-SA-04 is the only screen that shows JROS's own default theme.</td></tr>
        </tbody>
      </table></div>
    </section>

    <section class="block">
      <h2><span class="idx">7</span>User Roles Involved</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Surface</th><th>Primary Role</th></tr></thead>
        <tbody>
          <tr><td>Customer App (SCR-CUST-*)</td><td>Customer</td></tr>
          <tr><td>Jeweller Admin (SCR-ADM-*)</td><td>Jeweller Owner, Branch Staff</td></tr>
          <tr><td>Super Admin (SCR-SA-*)</td><td>JROS Platform Team</td></tr>
        </tbody>
      </table></div>
    </section>

    <section class="block">
      <h2><span class="idx">8</span>Developer Notes</h2>
      <ul>
        <li>Build a shared component library first (Chapter 12) — KPI cards, progress rings, and tables repeat across SCR-ADM-01, SCR-ADM-02, SCR-SA-01 with only data changing.</li>
        <li>SCR-CUST-04's progress ring and SCR-CUST-06's passbook must read from the same underlying installment ledger — do not maintain two sources of truth for "gold saved."</li>
      </ul>
    </section>

    <section class="block">
      <h2><span class="idx">9</span>UI/UX Notes</h2>
      <ul>
        <li>Reference thumbnails above are the approved visual baseline. Any deviation during implementation should be flagged to design before merging.</li>
        <li>SCR-SA-03 (Branding Settings) is the control panel that determines how all SCR-CUST-* and SCR-ADM-* screens look per tenant — build it early since it unblocks visual QA on everything else.</li>
      </ul>
    </section>

    <section class="block">
      <h2><span class="idx">10</span>Database Considerations</h2>
      <p>See Chapter 14. Screens map roughly to these core entities: <code>users</code>, <code>schemes</code>, <code>scheme_subscriptions</code>, <code>installments</code>, <code>payments</code>, <code>products</code>, <code>branches</code>, <code>tenants</code>, <code>tenant_branding</code>.</p>
    </section>

    <section class="block">
      <h2><span class="idx">11</span>API Considerations</h2>
      <p class="not-applicable">Each screen's data contract is detailed per-endpoint in Chapter 15 — API Specification.</p>
    </section>

    <section class="block"><h2><span class="idx">12</span>Validation Rules</h2><p class="not-applicable">Covered per-screen in Chapter 17.</p></section>
    <section class="block"><h2><span class="idx">13</span>Security Considerations</h2><p>SCR-ADM-* and SCR-SA-* screens require authenticated, role-checked access (Chapter 18 — RBAC). SCR-CUST-* screens beyond Login require a valid customer session tied to a single tenant.</p></section>
    <section class="block"><h2><span class="idx">14</span>Error Handling</h2><p class="not-applicable">Covered per-flow in Chapter 9 and per-screen in Chapter 21.</p></section>

    <section class="block">
      <h2><span class="idx">15</span>Dependencies</h2>
      <ul><li>Depends on Chapter 1 (Vision) for surface scope and Chapter 3 (Product Requirements) for feature detail.</li>
      <li>Feeds Chapter 7 (Navigation Architecture), Chapter 9 (User Flows), and Chapter 12 (Component Library).</li></ul>
    </section>

    <section class="block">
      <h2><span class="idx">16</span>Acceptance Criteria</h2>
      <ul class="checklist">
        <li>All 15 screens have a unique, documented Screen ID.</li>
        <li>Every screen thumbnail matches the latest approved design file.</li>
        <li>No screen exists in code without a corresponding entry in this inventory.</li>
      </ul>
    </section>

    <section class="block">
      <h2><span class="idx">17</span>Future Scope</h2>
      <p>V2 adds CRM and Multi-branch screens under <code>SCR-ADM-*</code>; V3 adds Inventory and POS screens. New IDs continue the existing numbering — e.g. <code>SCR-ADM-04</code> onward.</p>
    </section>

    <footer class="page-footer"><span>JROS Product Bible</span><span>Chapter 08 of 24</span></footer>
  `;
}

function render_ch9(){
  return `
    <div class="crumb">JROS Product Bible / Chapter 09</div>
    <div class="chapter-header">
      ${seal(9)}
      <div class="chapter-title">

flowchart TD
    A[Open App] --> B{Existing user?}

    C --> D[OTP Verification]

    F --> G
    G --> H["Browse / Select Scheme"]
    H --> I["Scheme Details (SCR-CUST-04)"]
    I --> J[Enter First Installment Amount]
    J --> K["Payment Screen (SCR-CUST-05)"]
    K --> L[Complete Payment]
    L --> M[Scheme Activated]
    M --> N["Digital Passbook Entry Created (SCR-CUST-06)"]
      </div>
      <div class="flow-strip">
        <img src="${IMG.customer_2_login}"><span class="arrow">→</span>
        <img src="${IMG.customer_3_home_dashboard}"><span class="arrow">→</span>
        <img src="${IMG.customer_4_scheme_details}"><span class="arrow">→</span>
        <img src="${IMG.customer_5_payment_screen}"><span class="arrow">→</span>
        <img src="${IMG.customer_6_digital_passbook}">
      </div>

      <h3 style="font-family:var(--font-display);font-size:15px;color:var(--ink);margin:22px 0 4px;">Flow B — Recurring Installment Payment</h3>
      <div class="mermaid">
flowchart TD
    A[Reminder: Push / SMS / WhatsApp] --> B["Customer Opens App → Home Dashboard (SCR-CUST-03)"]
    B --> C["Tap Pay Installment"]
    C --> D["Scheme Details (SCR-CUST-04)"]
    D --> E["Pay Now → Payment Screen (SCR-CUST-05)"]
    E --> F{Payment Method}
    F -->|UPI| G[UPI App Redirect]
    F -->|Card| H[Card Gateway]

    H --> J

    M --> E

      <div class="mermaid">
flowchart TD

    <section class="block"><h2><span class="idx">4</span>Features</h2><p class="not-applicable">See Chapter 3.</p></section>
