# DFX Collector Engine — manual/fallback auto-publish trigger (testing repo).
#
# The 5-minute schedule now runs ON THE E2E NODE, not here:
#   /etc/cron.d/dfx-gold-rate -> /opt/dfx-web/publish-rate.sh
# It calls the same route over loopback, so it needs no public URL, no GitHub
# runner and no shared secret in transit, and it keeps running if GitHub's cron
# is delayed or skipped.
#
# This workflow is kept as a MANUAL trigger only (Actions -> Run workflow) for
# when you want to force a publish without SSH access. Its schedule is
# deliberately removed: running both schedulers would publish the same rate
# twice every 5 minutes and duplicate the rate-history audit trail.
#
# The publish route enforces market hours (09:05-23:25 IST, Mon-Fri) and sanity
# checks, so an off-hours or bad-scrape run no-ops with published:false.
#
# Target: the E2E test node, which hosts the web app, the API and its own
# Postgres. This repo is the TESTING repo — it must never point at the
# production Render backend or the production web app.
#
# Optional repo secrets (Settings -> Secrets and variables -> Actions):
#   PUBLISH_URL   overrides the default E2E URL below
#   CRON_SECRET   must match CRON_SECRET in /opt/dfx-web/.env.web on E2E

name: live-rates-cron

on:
  # No schedule: the E2E node's own cron owns the 5-minute cadence.
  workflow_dispatch: {}

concurrency:
  group: live-rates-cron
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Scrape & publish live rate
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL || 'https://164-52-198-31.sslip.io/api/live-rates/publish' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PUBLISH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::PUBLISH_URL and CRON_SECRET secrets must be set."
            exit 1
          fi
          echo "POST $PUBLISH_URL"
          code=$(curl -sS -m 40 -o /tmp/out.json -w "%{http_code}" \
            -X POST "$PUBLISH_URL" \
            -H "x-cron-secret: $CRON_SECRET" || echo "000")
          echo "HTTP $code"
          echo "----- response -----"
          head -c 800 /tmp/out.json || true
          echo ""
          # 200 covers both a real publish and an intentional no-op
          # (market-closed / sanity-failed). Only non-200 is worth a warning.
          if [ "$code" = "200" ]; then
            echo "OK"
          else
            echo "::warning::Non-200 ($code) — will retry next run."
          fi
