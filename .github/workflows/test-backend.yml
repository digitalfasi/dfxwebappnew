name: JROS Backend Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    name: Run JROS Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx anyio

      - name: Run Security Unit Tests (no DB required)
        working-directory: Backend
        run: |
          python -m pytest tests/security/ -v --tb=short

      - name: Run Full Test Suite
        working-directory: Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          ENVIRONMENT: testing
          DEBUG: "false"
        run: |
          python -m pytest tests/ -v --tb=short -p no:warnings
